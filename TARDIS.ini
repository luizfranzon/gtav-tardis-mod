; TARDIS for GTA V - settings. Key names follow Garry's Mod (W, SPACE, LSHIFT, LCONTROL, LALT, MOUSE_RIGHT, F5, PAD_8...).
; Defaults match TARDIS Rewrite.

[Keys]
spawn=F5
; Travel to the map waypoint (while piloting)
teleport-demat=H
; Pilot view (ThirdPerson)
flight-toggle=R
float-toggle=T
handbrake=J
cloak-toggle=L
physlock-toggle=G
; Reflects every attack back at the attacker and throws out anything entering its 5 m bubble (not in GMod)
shield-toggle=K
; Flight top speed, 1 km/h a tap, faster held; PAD_0 back to the default (needs Num Lock on)
flight-speed-up=PAD_8
flight-speed-down=PAD_5
flight-speed-reset=PAD_0
; Flight
flight-forward=W
flight-backward=S
flight-left=A
flight-right=D
flight-up=SPACE
flight-down=LCONTROL
flight-boost=LSHIFT
flight-rotate=LALT
flight-spindir=MOUSE_RIGHT
; Float
float-forward=W
float-backward=S
float-left=A
float-right=D
float-boost=LSHIFT
float-rotate=LALT
float-brake=SPACE

[Flight]
; GMod "boost-speed" (1.0 - 8.0)
BoostSpeed=2.5

[Camera]
MouseSensitivity=8.0

[Exterior]
; TardisV, the add-on vehicle that tools/install_model.ps1 installs. Any prop or vehicle model name works.
Model=tardis
; Metres in front of the exterior where you step out
ExitOffset=1.4

[Sound]
; 0 mutes the TARDIS, 1 is normal
Volume=1.0

[HUD]
; 1 shows the console panel while piloting, 0 hides it. Its language follows the game's (TARDIS/translations).
Panel=1

[Lamp]
; 1 keeps the roof light on even parked (GMod "extlight-alwayson"); it always pulses while flying or travelling
AlwaysOn=0
; Red green blue, 0-255 (the Toyota's warm yellow)
Colour=255 231 95
; Metres below the model's top where the light sits
BelowTop=0.15

[Physics]
; How hard the TARDIS rights itself and leans into flight
StabilizeK=40.0

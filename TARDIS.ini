; TARDIS for GTA V - settings. Key names follow Garry's Mod (W, SPACE, LSHIFT, LCONTROL, LALT, MOUSE_RIGHT, F5...).
; Defaults match TARDIS Rewrite.

[Keys]
spawn=F5
; Pilot view (ThirdPerson)
flight-toggle=R
float-toggle=T
handbrake=J
; Flight
flight-forward=W
flight-backward=S
flight-left=A
flight-right=D
flight-up=SPACE
flight-down=LCONTROL
flight-boost=LSHIFT
flight-rotate=LALT
flight-spindir=MOUSE_RIGHT
; Float
float-forward=W
float-backward=S
float-left=A
float-right=D
float-boost=LSHIFT
float-rotate=LALT
float-brake=SPACE

[Flight]
; GMod "boost-speed" (1.0 - 8.0)
BoostSpeed=2.5

[Camera]
MouseSensitivity=8.0

[Exterior]
; TardisV (replaces the Maverick via OpenRPF mods folder). Any prop or vehicle model name works.
Model=maverick
; Metres in front of the exterior where you step out
ExitOffset=1.4

[Sound]
; 0 mutes the TARDIS, 1 is normal
Volume=1.0

[HUD]
; 1 shows the list of TARDIS keys on screen, 0 hides it
Legend=1

[Physics]
; How hard the TARDIS rights itself and leans into flight
StabilizeK=40.0
